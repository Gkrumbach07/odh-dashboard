agent: agents/odh-review.md
model: sonnet
image: ghcr.io/fullsend-ai/fullsend-sandbox:latest
role: review
slug: fullsend-ai-review
readonly_repo: true

skills:
  - skills/style-review
  - skills/rbac-review
  - skills/jira-eval-review

host_files:
  - src: references/css-patternfly.md
    dest: /tmp/rules/css-patternfly.md
  - src: references/security.md
    dest: /tmp/rules/security.md
  - src: references/conventions.md
    dest: /tmp/rules/conventions.md
  - src: references/rbac-reference.md
    dest: /tmp/rules/rbac-reference.md
  - src: gcp-credentials.json
    dest: /tmp/gcp-credentials.json
    optional: true

pre_script: scripts/pre-review.sh
post_script: scripts/post-review.sh

validation_loop:
  script: scripts/validate-review.sh
  schema: schemas/odh-review-result.schema.json
  max_iterations: 3

timeout_minutes: 30

providers:
  - vertex-ai
  - github

env:
  runner:
    JIRA_READ_ONLY: "true"
  sandbox:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: "${ANTHROPIC_VERTEX_PROJECT_ID}"
    CLOUD_ML_REGION: "${CLOUD_ML_REGION}"
    GOOGLE_APPLICATION_CREDENTIALS: "/tmp/gcp-credentials.json"
    ANTHROPIC_VERTEX_ACCESS_TOKEN: "${VERTEX_ACCESS_TOKEN}"
