kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-modules
rules:
  # MLflow CR auto-discovery (mlflow-ui, gen-ai-ui)
  - apiGroups:
      - mlflow.opendatahub.io
    verbs:
      - get
      - list
      - watch
    resources:
      - mlflows
  # Cluster domain discovery (gen-ai-ui, maas-ui)
  - apiGroups:
      - config.openshift.io
    verbs:
      - get
      - list
      - watch
    resources:
      - ingresses
  # OTel Collector — create/manage the gen-ai-trace-collector CR for per-namespace trace routing (gen-ai-ui)
  # TODO: Move to modules/gen-ai/cluster-role.yaml once per-module SAs are active (3.5 pod migration)
  - apiGroups:
      - opentelemetry.io
    verbs:
      - get
      - list
      - create
      - update
      - delete
    resources:
      - opentelemetrycollectors
  # SubjectAccessReview for namespace access checks
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  # Impersonate dashboard users when AUTH_METHOD=internal (Kubeflow headers)
  - apiGroups:
      - ""
    verbs:
      - impersonate
    resources:
      - users
      - groups
      - serviceaccounts
  # Agent Ops — OpenShell gateway discovery. Gateways are found by listing
  # Services carrying the OpenShell chart's label, and each one's OIDC issuer
  # and audience are read from that gateway's own ConfigMap so they cannot
  # drift out of step with the gateway that has to accept the token.
  #
  # Deliberately no `list` on configmaps: with `get` only, a ConfigMap can be
  # read when its exact name was derived from a gateway Service already found,
  # and nothing else can be enumerated. To narrow further, set
  # OPENSHELL_GATEWAY_NAMESPACES and move these two rules into a Role in each.
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
    resources:
      - services
  - apiGroups:
      - ""
    verbs:
      - get
    resources:
      - configmaps
