name: ODH Fullsend Review

# Fullsend-driven code review for PRs.
# Replaces claude-preflight.yml on the fork.
#
# Triggers:
#   pull_request_target — auto-runs on PR open/reopen
#   issue_comment       — /fs-review command (org members / collaborators only)
#
# Required Secrets:
#   CLAUDE_APP_ID, CLAUDE_APP_PRIVATE_KEY, GCP_CREDENTIALS_JSON, GCP_PROJECT_ID
#
# Optional Secrets:
#   JIRA_URL, JIRA_USERNAME, JIRA_API_TOKEN (for Jira eval review)

on:
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  # ------------------------------------------------------------------ #
  #  Router                                                             #
  # ------------------------------------------------------------------ #
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    outputs:
      matrix: ${{ steps.pr.outputs.matrix || steps.comment.outputs.matrix || '[]' }}

    steps:
      - name: Route pull_request_target
        id: pr
        if: github.event_name == 'pull_request_target'
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "→ Fullsend review for PR #$PR_NUMBER (pull_request_target)"
          MATRIX=$(jq -nc --arg n "$PR_NUMBER" --arg s "$HEAD_SHA" --arg r "$HEAD_REF" --arg h "$HEAD_REPO" \
            '[{"pr_number":$n,"head_sha":$s,"head_ref":$r,"head_repo":$h}]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Route issue_comment
        id: comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          ACTOR: ${{ github.triggering_actor }}
          IS_PR: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$ACTOR" == *"[bot]"* ]]; then
            echo "Skipping: bot comment"; exit 0
          fi
          if [[ ! "$AUTHOR_ASSOC" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            echo "Skipping: $AUTHOR_ASSOC not authorized"; exit 0
          fi
          if [ -z "$IS_PR" ]; then
            echo "Skipping: not a PR"; exit 0
          fi

          if ! echo "$COMMENT_BODY" | grep -qi "/fs-review"; then
            echo "Skipping: no /fs-review command found"; exit 0
          fi

          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="+1" --silent || true

          PR_DATA=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefOid,headRefName,headRepository)
          SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          HR=$(echo "$PR_DATA" | jq -r 'if .headRepository.owner then .headRepository.owner.login + "/" + .headRepository.name else empty end')
          echo "→ Fullsend review for PR #$ISSUE_NUMBER (comment)"
          MATRIX=$(jq -nc --arg n "$ISSUE_NUMBER" --arg s "$SHA" --arg r "$REF" --arg h "${HR:-$REPO}" \
            '[{"pr_number":$n,"head_sha":$s,"head_ref":$r,"head_repo":$h}]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  #  Review                                                             #
  # ------------------------------------------------------------------ #
  review:
    needs: router
    if: needs.router.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include: ${{ fromJSON(needs.router.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: fullsend-review-pr-${{ matrix.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ matrix.pr_number }}
      HEAD_SHA: ${{ matrix.head_sha }}
      HEAD_REF: ${{ matrix.head_ref }}
      HEAD_REPO: ${{ matrix.head_repo }}
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CLOUD_ML_REGION: us-east5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: write
          permission-actions: read

      - name: Create check run
        id: check-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          CHECK_RUN_ID=$(gh api "repos/$REPO/check-runs" \
            -f "name=ODH Fullsend Review" \
            -f "head_sha=$HEAD_SHA" \
            -f "status=in_progress" \
            -f "output[title]=Fullsend review running..." \
            -f "output[summary]=**PR:** #$PR_NUMBER" \
            --jq '.id')
          echo "id=$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Install fullsend CLI
        uses: fullsend-ai/fullsend@v0
        with:
          agent: __install_only__

      - name: Generate Vertex AI access token
        id: vertex-token
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Write sandbox ADC credentials
        run: |
          # Write a minimal ADC-compatible credential file using the access token
          # so Claude Code can authenticate via GOOGLE_APPLICATION_CREDENTIALS
          cat > .fullsend/adc-credentials.json << ENDOFCRED
          {
            "type": "external_account",
            "audience": "",
            "subject_token_type": "urn:ietf:params:oauth:token-type:access_token",
            "token_url": "https://sts.googleapis.com/v1/token",
            "credential_source": {
              "file": "/tmp/vertex-access-token"
            },
            "service_account_impersonation_url": ""
          }
          ENDOFCRED
          echo -n "${{ steps.vertex-token.outputs.token }}" > .fullsend/vertex-access-token

      - name: Run review agent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ANTHROPIC_VERTEX_ACCESS_TOKEN: ${{ steps.vertex-token.outputs.token }}
        run: |
          mkdir -p "${{ github.workspace }}/output"

          fullsend run odh-review \
            --fullsend-dir .fullsend \
            --output-dir "${{ github.workspace }}/output" \
            --target-repo .

      # ── Fallback: check run updates ──
      - name: Update check run (success)
        if: success() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=success" \
            -f "output[title]=Fullsend review complete" \
            -f "output[summary]=See PR review for details."

      - name: Update check run (failure)
        if: failure() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=failure" \
            -f "output[title]=Fullsend review failed" \
            -f "output[summary]=Check the [workflow run]($RUN_URL)."

      - name: Update check run (cancelled)
        if: cancelled() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=cancelled" \
            -f "output[title]=Fullsend review cancelled" \
            -f "output[summary]=Superseded by a newer run."
