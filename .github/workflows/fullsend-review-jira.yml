---
# Repository-owned Fullsend review entry point for testing Jira context.
#
# The generated fullsend.yaml remains untouched by local integrations. This
# workflow uses Fullsend's supported pre-computed matrix path so Jira secrets
# reach the trusted host-side review pre-script. The script writes a sanitized
# snapshot that is mounted into the sandbox; credentials are not mounted.
name: Fullsend review with Jira context

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: number

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  prepare:
    name: Prepare review dispatch
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build review matrix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi

          pr_json="$(gh api "repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}")"
          if [[ "$(jq -r '.state' <<<"${pr_json}")" != "open" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open"
            exit 1
          fi

          event_payload="$(jq -cn \
            --arg repo "${REPO_FULL_NAME}" \
            --arg actor "${TRIGGER_ACTOR}" \
            --argjson pr "${pr_json}" \
            '{
              action: "synchronize",
              number: $pr.number,
              pull_request: $pr,
              repository: {full_name: $repo},
              sender: {login: $actor, type: "User"},
              _normalized_event: {
                version: "1",
                source: {system: "github", raw_type: "workflow_dispatch"},
                entity: {
                  kind: "change_proposal",
                  id: $pr.number,
                  key: ($pr.number | tostring),
                  url: $pr.html_url
                },
                transition: {kind: "synchronized"},
                actor: {id: $actor, kind: "human", role: "write"},
                state: {
                  labels: [$pr.labels[].name],
                  change_proposal: {
                    is_fork: ($pr.head.repo.full_name != $pr.base.repo.full_name),
                    head_ref: $pr.head.ref,
                    base_ref: $pr.base.ref
                  }
                }
              }
            }')"

          matrix="$(jq -cn \
            --arg repo "${REPO_FULL_NAME}" \
            --arg number "${PR_NUMBER}" \
            --arg payload "${event_payload}" \
            '{include: [{
              agent: "review",
              source_repo: $repo,
              role: "review",
              event_payload: $payload,
              status_repo: $repo,
              status_number: $number
            }]}')"

          delimiter="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${delimiter}"
            printf '%s\n' "${matrix}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  review:
    name: Review
    needs: prepare
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d9e8bec726f85e0cfd1aeca44252030135a5b1d1 # v0.39.0
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USERNAME }}
