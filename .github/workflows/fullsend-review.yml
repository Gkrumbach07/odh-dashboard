name: ODH Fullsend Review

on:
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      checks: read
    outputs:
      matrix: ${{ steps.pr.outputs.matrix || steps.comment.outputs.matrix || '[]' }}

    steps:
      - name: Route pull_request_target
        id: pr
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          MATRIX=$(jq -nc --arg n "$PR_NUMBER" --arg s "$HEAD_SHA" --arg r "$HEAD_REF" --arg h "$HEAD_REPO" \
            '[{"pr_number":$n,"head_sha":$s,"head_ref":$r,"head_repo":$h}]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Route issue_comment
        id: comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
          ACTOR: ${{ github.triggering_actor }}
          IS_PR: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$ACTOR" == *"[bot]"* ]] && exit 0
          [[ ! "$AUTHOR_ASSOC" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]] && exit 0
          [ -z "$IS_PR" ] && exit 0
          echo "$COMMENT_BODY" | grep -qi "/fs-review" || exit 0
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="+1" --silent || true
          PR_DATA=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json headRefOid,headRefName,headRepository)
          SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          HR=$(echo "$PR_DATA" | jq -r 'if .headRepository.owner then .headRepository.owner.login + "/" + .headRepository.name else empty end')
          MATRIX=$(jq -nc --arg n "$ISSUE_NUMBER" --arg s "$SHA" --arg r "$REF" --arg h "${HR:-$REPO}" \
            '[{"pr_number":$n,"head_sha":$s,"head_ref":$r,"head_repo":$h}]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  review:
    needs: router
    if: needs.router.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include: ${{ fromJSON(needs.router.outputs.matrix) }}
      fail-fast: false
    concurrency:
      group: fullsend-review-pr-${{ matrix.pr_number }}
      cancel-in-progress: true

    env:
      PR_NUMBER: ${{ matrix.pr_number }}
      HEAD_SHA: ${{ matrix.head_sha }}
      HEAD_REF: ${{ matrix.head_ref }}
      HEAD_REPO: ${{ matrix.head_repo }}
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CLOUD_ML_REGION: us-east5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: write
          permission-actions: read

      - name: Create check run
        id: check-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          CHECK_RUN_ID=$(gh api "repos/$REPO/check-runs" \
            -f "name=ODH Fullsend Review" \
            -f "head_sha=$HEAD_SHA" \
            -f "status=in_progress" \
            -f "output[title]=Fullsend review running..." \
            -f "output[summary]=**PR:** #$PR_NUMBER" \
            --jq '.id')
          echo "id=$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run fullsend review
        uses: fullsend-ai/fullsend@v0
        with:
          agent: odh-review
          fullsend-dir: ${{ github.workspace }}/.fullsend
          target-repo: ${{ github.workspace }}
          github_token: ${{ steps.app-token.outputs.token }}
          mint-url: ${{ vars.FULLSEND_MINT_URL }}
          status-repo: ${{ github.repository }}
          status-number: ${{ matrix.pr_number }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pr-head-sha: ${{ env.HEAD_SHA }}

      - name: Update check run (success)
        if: success() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=success" \
            -f "output[title]=Fullsend review complete" \
            -f "output[summary]=See PR review for details."

      - name: Update check run (failure)
        if: failure() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=failure" \
            -f "output[title]=Fullsend review failed" \
            -f "output[summary]=Check the [workflow run]($RUN_URL)."

      - name: Update check run (cancelled)
        if: cancelled() && steps.check-run.outputs.id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check-run.outputs.id }}
        run: |
          gh api "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -X PATCH \
            -f "status=completed" -f "conclusion=cancelled" \
            -f "output[title]=Fullsend review cancelled" \
            -f "output[summary]=Superseded by a newer run."
