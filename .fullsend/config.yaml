# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
version: "1"

roles:
    - review
    - triage
    - coder
    - retro
    - prioritize

allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/

agents:
    - name: review
      source: customized/harness/review.yaml
      enabled: true
    - name: triage
      source: customized/harness/triage.yaml
      enabled: true
    - name: code
      source: customized/harness/code.yaml
      enabled: true

create_issues:
    allow_targets:
        repos:
            - Gkrumbach07/odh-dashboard
            - fullsend-ai/fullsend
