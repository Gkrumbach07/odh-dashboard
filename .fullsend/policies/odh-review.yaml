name: odh-review-policy
description: Sandbox security policy for the ODH review agent. Read-only repo access, network egress for GitHub API and Jira.

filesystem:
  mode: read-only
  writable_paths:
    - /workspace/output/
    - /tmp/

network:
  egress:
    allowed:
      - "api.github.com"
      - "github.com"
      - "*.atlassian.net"
      - "*.redhat.com"
      - "us-east5-aiplatform.googleapis.com"
    denied:
      - "*"

processes:
  allowed_binaries:
    - /usr/bin/gh
    - /usr/bin/git
    - /usr/bin/jq
    - /usr/bin/curl
    - /usr/bin/grep
    - /usr/bin/find
    - /usr/bin/ls
    - /usr/bin/cat
    - /usr/bin/head
    - /usr/bin/tail
    - /usr/bin/wc
    - /usr/bin/tr
    - /usr/bin/sed
    - /usr/bin/awk
    - /usr/bin/sort
    - /usr/bin/uniq
    - /usr/bin/bash

resources:
  max_memory_mb: 4096
  max_cpu_seconds: 1800
