# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: '1'
runtime: claude
# Replace sticky comment bodies in-place (no collapsed "Previous run" history).
# https://github.com/fullsend-ai/fullsend/pull/6930
keep_history: false
roles:
  - review
agents:
  # Dashboard overlay; the base harness still supplies Fullsend's review skills.
  - name: review
    source: harness/review.yaml
    # Fork-only Pi multi-provider canary. Keep the repository default on Claude
    # so every non-review role remains on the production runtime.
    runtime: pi
    # Keep the orchestrator on Luna while comparing task-specialized workers.
    model: openai/gpt-5.6-luna
    # Each local persona declares a Claude alias in frontmatter. Route every
    # registered review persona explicitly. The available provider catalog is
    # verified by the dispatch gate: Opus challenges, Gemini Pro handles deep
    # analysis, and Luna/Flash handle focused checks.
    subagents:
      challenger: anthropic-vertex/claude-opus-4-6
      correctness: google-vertex/gemini-3.1-pro-preview
      cross-repo-contracts: google-vertex/gemini-3.1-pro-preview
      docs-currency: google-vertex/gemini-3-flash-preview
      intent-coherence: openai/gpt-5.6-luna
      security: anthropic-vertex/claude-opus-4-6
      security-triage: openai/gpt-5.6-luna
      style-conventions: google-vertex/gemini-3-flash-preview
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/fullsend/
  - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
  allow_targets:
    repos:
      - opendatahub-io/odh-dashboard
      - fullsend-ai/fullsend
inference:
  project: ambient-code-platform
  wif_provider: projects/888214980327/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-opendatahub-io-odh-dashboard
