apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ops-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: agent-ops-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8843
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    # OpenShell gateways: the embedded BFF dials each gateway's gRPC endpoint
    # directly, so without this every gateway reports itself unconnectable.
    #
    # Selected by the same label discovery keys on, in ANY namespace, rather
    # than by naming one. Gateways are discovered wherever they are installed,
    # so pinning a single namespace here silently caps the fleet at whichever
    # one was named — the rest are found, listed, and then time out.
    # This is also tighter than opening the ports to 0.0.0.0/0: it reaches
    # exactly the set of pods discovery is able to find.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell
      ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
