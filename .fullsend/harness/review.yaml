base: https://raw.githubusercontent.com/fullsend-ai/agents/91f61f3441baedf3f912c9afd4bd574c98793b96/harness/review.yaml#sha256=c805713f74d2d5c21eeefefaee42962136a6c83954a8d468463f8e13861e8d08

skills:
  - skills/pr-review
  - skills/review-host-contract
  - skills/issue-labels
  - skills/description-jira

host_files:
  - src: dimensions.json
    dest: /sandbox/workspace/.fullsend/dimensions.json
  - src: .run/collected.json
    dest: /sandbox/workspace/.fullsend/.run/collected.json
    optional: true
  - src: .run/jira.json
    dest: /sandbox/workspace/.fullsend/.run/jira.json
    optional: true

env:
  sandbox:
    # Keep the sandbox on the same PR as the generic matrix runner. Only the
    # normalized identifiers cross this boundary; Jira credentials do not.
    GITHUB_PR_URL: "${FULLSEND_WORK_ITEM_URL}"
    PR_NUMBER: "${ISSUE_NUMBER}"

model: sonnet
validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/review-result.schema.json
  max_iterations: 1

post_script: scripts/post-review.sh
pre_script: scripts/pre-review.sh

forge:
  github:
    post_script: scripts/post-review.sh
    pre_script: scripts/pre-review.sh
    env:
      runner:
        # The generic precomputed-matrix runner exposes work-item names rather
        # than the review-specific names expected by the upstream harness.
        GITHUB_PR_URL: "${FULLSEND_WORK_ITEM_URL}"
        PR_NUMBER: "${ISSUE_NUMBER}"
