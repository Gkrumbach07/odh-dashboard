# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
# Replace sticky comment bodies in-place (no collapsed "Previous run" history).
# https://github.com/fullsend-ai/fullsend/pull/6930
keep_history: false
agents:
    # roles: used to carry the opt-out for triage, retro and prioritize: none
    # of them mapped to review or coder, so the dispatch role check skipped
    # them. That check was removed in fullsend v0.51.0 (fullsend-ai/fullsend#7786),
    # after which roles: no longer gates execution at all. The three entries
    # below state that intent directly, so it survives the shim upgrade.
    # See fullsend-ai/fullsend#9096.
    - name: triage
      enabled: false
    - name: retro
      enabled: false
    - name: prioritize
      enabled: false
    # Code agent for the RHOAIENG Jira pilot (fullsend-poll-jira.yaml). Only
    # the Jira poller dispatches it: the shim routes no GitHub issue events,
    # so GitHub /fs-code and ready-to-code stay inert.
    - name: code
      source: harness/code.yaml
      runtime: pi
      model: openai/gpt-6.1-sol
    # Dashboard overlay; the base harness still supplies Fullsend's review skills.
    - name: review
      source: harness/review.yaml
      # Keep non-review roles on the production default while using Pi's
      # per-persona model routing for reviews. OpenAI models are named here and
      # per persona, not through models.aliases: Fullsend v0.48 deprecates
      # aliases that point outside the Claude family, and the aliases would
      # also remap opus/sonnet for the Claude Code roles. Every persona the
      # review uploads is listed, so no frontmatter tier resolves to Claude;
      # rows without a persona run on the agent model.
      runtime: pi
      model: openai/gpt-6-luna
      subagents:
          challenger: openai/gpt-6.1-sol
          correctness: openai/gpt-6.1-sol
          cross-repo-contracts: openai/gpt-6.1-sol
          docs-currency: openai/gpt-6-luna
          intent-coherence: openai/gpt-6.1-sol
          investigator: openai/gpt-6-luna
          # Rating's risk/confidence gates approval; tiny output, so pay for Sol.
          rating: openai/gpt-6.1-sol
          security: openai/gpt-6.1-sol
          security-triage: openai/gpt-6-luna
          style-conventions: openai/gpt-6-luna
    # Pin the built-in fix agent to the agents v0.54.0 release
    # (87a43fcb), the same commit harness/code.yaml already bases on.
    # Without an entry here, fix is resolved by Fullsend's agents-repo
    # fallback, which on this shim tracks fullsend-ai/agents@main: the
    # reusable-dispatch pin is not a release tag, so the CLI is built from
    # source and resolveAgentsRef() returns main instead of a version tag.
    # fix.yaml's relative scripts/skills/schema resolve against this URL,
    # so pinning the harness pins the whole agent.
    # Re-pin by editing this URL to the next release's commit; do not run
    # a bare `fullsend agent update fix`, which re-resolves to main.
    - name: fix
      source: https://raw.githubusercontent.com/fullsend-ai/agents/87a43fcb849546b267a619434ca19dedde8df476/harness/fix.yaml#sha256=aa53c3e79b349b746014e7cfa213ab582e7464cf4226a1f08df96490d27385dc
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
# Who may start the code agent from Jira, by /fs-code or by adding
# ready-to-code (labels: allowlist). Jira account IDs, from the profile URL.
# Needs Fullsend v0.54.0; the review shim's older CLI runs fine with it, but its
# `fullsend agent add/set/update/remove` reject it.
authorization:
    - provider: jira
      write:
          accounts:
              - "70121:6ffe4358-1556-4a4e-a0d8-1f2593d39f68" # Gage Krumbach
              - "712020:ce710f80-369e-4b6d-95e2-ca6c9e58d9fb" # Christian Vogt
      labels: allowlist
create_issues:
    allow_targets:
        repos:
            - opendatahub-io/odh-dashboard
            - fullsend-ai/fullsend
inference:
    project: ambient-code-platform
    wif_provider: projects/888214980327/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-opendatahub-io-odh-dashboard
